name: run-automation

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Which automation to run?'
        required: true
        type: choice
        options:
          - Auto
          - IMFL
          - CS
      start_date:
        description: 'Start date (DD-MM-YYYY) - Optional'
        required: false
        type: string
        default: ''
      end_date:
        description: 'End date (DD-MM-YYYY) - Optional'
        required: false
        type: string
        default: ''
      yesterday:
        description: 'Generate report for yesterday'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Google Chrome Stable
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Xvfb (Virtual Framebuffer)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Portal Reachability & Configure Fallback Proxy
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          echo "🔍 Testing direct connectivity to stateexcise.assam.gov.in..."
          if curl -k -sI --connect-timeout 25 --max-time 45 https://stateexcise.assam.gov.in/index.php/site/login > /dev/null; then
            echo "✅ Direct connection to portal succeeded."
            echo "USE_TOR_PROXY=false" >> $GITHUB_ENV
          elif [ -n "$SCRAPER_API_KEY" ]; then
            echo "⚠️ Direct connection timed out, using configured SCRAPER_API_KEY (Indian IP) proxy."
            echo "USE_TOR_PROXY=false" >> $GITHUB_ENV
          else
            echo "⚠️ Direct connection from US runner timed out. Installing Tor SOCKS5 fallback..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq tor netcat-openbsd
            printf "\nControlPort 9051\nCookieAuthentication 0\nExcludeExitNodes {in}\n" | sudo tee -a /etc/tor/torrc > /dev/null
            sudo service tor restart
            echo "Waiting for Tor SOCKS5 port and 100% bootstrap..."
            for i in $(seq 1 30); do
              if nc -z 127.0.0.1 9050 2>/dev/null && nc -z 127.0.0.1 9051 2>/dev/null; then
                BOOT=$(printf 'AUTHENTICATE ""\r\nGETINFO status/bootstrap-phase\r\nQUIT\r\n' | nc -w 2 127.0.0.1 9051 2>/dev/null || true)
                if echo "$BOOT" | grep -q "PROGRESS=100"; then
                  echo "✅ Tor SOCKS5 proxy listening on 127.0.0.1:9050 and 100% bootstrapped!"
                  break
                fi
              fi
              sleep 1
            done
            echo "Verifying Tor circuit connectivity to portal..."
            for t in 1 2 3; do
              if curl --socks5-hostname 127.0.0.1:9050 -k -sI --connect-timeout 25 --max-time 60 https://stateexcise.assam.gov.in/index.php/site/login > /dev/null; then
                echo "✅ Tor circuit verified responsive to Assam Excise portal!"
                break
              fi
              echo "⚠️ Circuit attempt $t timed out. Signaling NEWNYM..."
              printf 'AUTHENTICATE ""\r\nSIGNAL NEWNYM\r\nQUIT\r\n' | nc -w 2 127.0.0.1 9051 > /dev/null || true
              sleep 6
            done
            echo "USE_TOR_PROXY=true" >> $GITHUB_ENV
          fi

      - name: Determine Run Mode
        id: mode
        run: |
          # If triggered by schedule, use 'Auto'
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "mode=Auto" >> $GITHUB_OUTPUT
            echo "Running in AUTO scheduled mode."
          else
            echo "mode=${{ github.event.inputs.run_mode }}" >> $GITHUB_OUTPUT
            echo "Running in MANUAL mode: ${{ github.event.inputs.run_mode }}"
          fi

      - name: Determine Date Arguments
        id: dates
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            ARGS="$ARGS --start_date ${{ github.event.inputs.start_date }}"
          fi
          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            ARGS="$ARGS --end_date ${{ github.event.inputs.end_date }}"
          fi
          if [ "${{ github.event.inputs.yesterday }}" = "true" ]; then
            ARGS="$ARGS --yesterday"
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT
          echo "Determined extra arguments: $ARGS"

      - name: Create Service Account Key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SERVICE_ACCOUNT_B64: ${{ secrets.SERVICE_ACCOUNT_B64 }}
        run: |
          mkdir -p keys
          if [ -n "$GCP_SA_KEY" ]; then
            echo "$GCP_SA_KEY" > keys/liquorbond-service.json
          elif [ -n "$SERVICE_ACCOUNT_B64" ]; then
            echo "$SERVICE_ACCOUNT_B64" | base64 -d > keys/liquorbond-service.json
          else
            echo "❌ No service account key secret found!"
            exit 1
          fi

      - name: Run IMFL Automation
        if: steps.mode.outputs.mode == 'Auto' || steps.mode.outputs.mode == 'IMFL'
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          IMFL_USERNAME: ${{ secrets.IMFL_USERNAME }}
          IMFL_PASSWORD: ${{ secrets.IMFL_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          xvfb-run -a python -u scripts/main_imfl.py --auto ${{ steps.dates.outputs.args }}

      - name: Run CS Automation
        if: always() && (steps.mode.outputs.mode == 'Auto' || steps.mode.outputs.mode == 'CS')
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          CS_USERNAME: ${{ secrets.CS_USERNAME }}
          CS_PASSWORD: ${{ secrets.CS_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          xvfb-run -a python -u scripts/main_cs.py --auto ${{ steps.dates.outputs.args }}

      - name: Commit and Push Checkpoint Changes
        if: always() && (steps.mode.outputs.mode == 'Auto' || steps.mode.outputs.mode == 'IMFL' || steps.mode.outputs.mode == 'CS')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add incoming_stock_checkpoint.json stock_data_checkpoint.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update checkpoint data"
            for i in {1..3}; do
              git pull --rebase origin main || git rebase --abort || true
              if git push origin main; then
                echo "✅ Checkpoint data pushed successfully."
                break
              fi
              echo "⚠️ Push failed (attempt $i/3). Retrying in 3s..."
              sleep 3
            done
          else
            echo "ℹ️ No checkpoint changes to commit."
          fi

      - name: Upload Debug Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
            *.html
